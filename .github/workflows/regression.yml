# =============================================================================
# GitHub Actions Workflow: Регрессионные тесты на BrowserStack
# =============================================================================
#
# ЧТО ДЕЛАЕТ ЭТОТ ФАЙЛ:
#   Запускает все Behave-тесты в облаке BrowserStack.
#   Браузер Chrome работает на серверах BrowserStack, не на GitHub VM.
#   GitHub VM только отправляет Selenium-команды.
#
# КАК ЗАПУСТИТЬ:
#   1. Автоматически — каждый день в 8:00 утра (UTC, = 12:00 по Москве)
#   2. Вручную — GitHub → Actions → "Regression Tests" → "Run workflow"
#   3. При пуше в main — автоматически после каждого git push
#
# НЕОБХОДИМЫЕ СЕКРЕТЫ (Settings → Secrets and variables → Actions):
#   BROWSERSTACK_USERNAME   — логин BrowserStack
#   BROWSERSTACK_ACCESS_KEY — ключ доступа BrowserStack
#
# ГДЕ СМОТРЕТЬ РЕЗУЛЬТАТЫ:
#   - GitHub Actions → вкладка workflow run → зелёный/красный статус
#   - BrowserStack Dashboard → Builds → "Regression ..." → видео + логи
# =============================================================================

name: Regression Tests

# --- КОГДА ЗАПУСКАТЬ ---
on:
  # По расписанию (cron). Формат: минуты часы день_месяца месяц день_недели
  # "0 8 * * 1-5" = каждый будний день в 08:00 UTC (12:00 МСК)
  schedule:
    - cron: '0 8 * * 1-5'

  # При пуше в main — тесты запустятся автоматически после каждого коммита
  push:
    branches: [main]

  # Ручной запуск — кнопка "Run workflow" в GitHub Actions UI
  workflow_dispatch:

jobs:
  regression:
    # Ubuntu — легче и быстрее чем Windows. Нам не нужна Windows на VM,
    # потому что Chrome запускается в BrowserStack, а не здесь.
    runs-on: ubuntu-latest

    # Максимальное время выполнения (минуты).
    # Если тесты зависнут — workflow остановится через 60 минут.
    timeout-minutes: 60

    steps:
      # --- Шаг 1: Скачать код из репозитория ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Шаг 2: Установить Python ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # --- Шаг 3: Установить зависимости (behave, selenium, и т.д.) ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Шаг 4: Запуск тестов ---
      # Все feature-файлы запускаются через behave.
      # Файлы с префиксом DEV* исключаются (это незавершённые тесты).
      #
      # BROWSERSTACK_USERNAME и BROWSERSTACK_ACCESS_KEY
      # берутся из GitHub Secrets и передаются как переменные окружения.
      # environment.py читает их через os.environ.get()
      #
      # --no-capture: показывать print() в логах (для дебага)
      # --tags=~@skip: пропускать тесты с тегом @skip (если понадобится)
      - name: Run Behave regression tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_BUILD_NAME: "Regression #${{ github.run_number }} (${{ github.event_name }})"
        run: |
          behave features/ \
            --no-capture \
            --tags="~@skip" \
            --exclude="DEV.*" \
            --format=pretty \
            2>&1 | tee test_results.log

      # --- Шаг 5: Сохранить логи как артефакт ---
      # Даже если тесты упали, логи будут доступны для скачивания
      # в GitHub Actions → workflow run → Artifacts
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-log
          path: test_results.log
          retention-days: 30
